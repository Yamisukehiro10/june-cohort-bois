<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Patient Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="patient-bg">
  <div class="overlay"></div>
  <div class="container patient-container">
    <img src="https://cdn-icons-png.flaticon.com/512/2966/2966484.png" alt="Patient Portal Logo" class="logo-img">
    <h1 class="patient-title">Patient <span class="highlight">Interface</span></h1>
    <!-- Submit Your Information -->
    <div class="section patient-section">
      <h2>Submit Your Information</h2>
      <form id="patient-form" class="form-section">
        <input type="text" id="name" placeholder="Your Name" required />
        <input type="number" id="age" placeholder="Your Age" required />
        <textarea id="diagnosis" placeholder="Describe your symptoms..." required></textarea>
        <textarea id="history" placeholder="Medical history (if any)..."></textarea>
        <button type="submit" class="role-btn patient-btn"><span>📝</span> Submit</button>
      </form>
      <div id="submit-message"></div>
    </div>
    <!-- Check Your Prescription -->
    <div class="section patient-section">
      <h2>Check Your Prescription</h2>
      <form id="check-form" class="form-section">
        <input type="text" id="check-name" placeholder="Enter your name" required>
        <input type="number" id="check-age" placeholder="Enter your age" required>
        <button type="submit" class="role-btn doctor-btn"><span>💊</span> View Prescription</button>
      </form>
      <div id="check-result"></div>
    </div>
  </div>
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app-patient.js"></script>
</body>
</html>
