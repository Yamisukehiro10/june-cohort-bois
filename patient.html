<!DOCTYPE html>
<html>
<head>
  <title>Patient Interface</title>
</head>
<body>
  <h2>Patient Dashboard</h2>
  <form id="patient-form">
    <input type="text" id="name" placeholder="Full Name" required /><br><br>
    <input type="number" id="age" placeholder="Age" required /><br><br>
    <input type="text" id="symptoms" placeholder="Symptoms" required /><br><br>
    <textarea id="history" placeholder="Medical History"></textarea><br><br>
    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <!-- App Script -->
  <script src="app-patient.js"></script>
</body>
</html>
